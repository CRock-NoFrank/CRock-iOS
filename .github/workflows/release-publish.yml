name: Publish Release on Merge

permissions:
  contents: write
  pull-requests: read

on:
  pull_request:
    branches: ["main"]
    types: [closed]

jobs:
  publish-release:
    # PR이 머지되었고, 타이틀에 'Release'가 포함된 경우에만 실행
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.title, 'Release')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          VERSION=$(echo "$TITLE" | grep -oP '\d+\.\d+\.\d+' | head -1)

          if [ -z "$VERSION" ]; then
            echo "::error::PR 타이틀에서 버전을 찾을 수 없습니다: $TITLE"
            exit 1
          fi

          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish Draft Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.RELEASE_VERSION }}
          draft: false
          allowUpdates: true
          updateOnlyUnreleased: true
          # 기존 draft의 name/body를 그대로 유지하기 위해 omit 옵션 사용
          omitName: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
