name: Publish Release on Merge

permissions:
  contents: write
  pull-requests: read

on:
  pull_request:
    branches: ["main"]
    types: [closed]

jobs:
  publish-release:
    # PR이 머지되었고, 타이틀에 'Release'가 포함된 경우에만 실행
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.title, 'Release')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          VERSION=$(echo "$TITLE" | grep -oE '[0-9]+\.[0-9]+' | head -1)

          if [ -z "$VERSION" ]; then
            echo "::error::PR 타이틀에서 버전을 찾을 수 없습니다: $TITLE"
            exit 1
          fi

          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish Draft Release
        run: |
          TAG="v${{ env.RELEASE_VERSION }}"
          echo "Publishing release for tag: $TAG"

          # Draft 릴리즈 목록 중 해당 태그를 가진 릴리즈 ID 조회
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n 1)

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Found draft release (ID: $RELEASE_ID). Publishing..."
            gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -F draft=false
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG found. Publishing via gh release edit..."
            gh release edit "$TAG" --draft=false
          else
            echo "::error::Publish할 Draft Release(태그: $TAG)를 찾을 수 없습니다."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
