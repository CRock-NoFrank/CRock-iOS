name: Test Cert Repo Access

on:
  push:

jobs:
  test-cert:
    runs-on: macos-26
    steps:
      - name: Debug - Check secrets are set
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          if [ -z "$MATCH_GIT_URL" ]; then
            echo "❌ MATCH_GIT_URL is EMPTY"
          else
            echo "✅ MATCH_GIT_URL is set (length: ${#MATCH_GIT_URL})"
          fi

          if [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "❌ MATCH_GIT_BASIC_AUTHORIZATION is EMPTY"
          else
            echo "✅ MATCH_GIT_BASIC_AUTHORIZATION is set (length: ${#MATCH_GIT_BASIC_AUTHORIZATION})"
          fi

      - name: Test cert repo clone
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          # base64 디코딩해서 형식 확인 (앞 10자만 출력)
          DECODED=$(printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 --decode)
          echo "Decoded prefix (first 10 chars): ${DECODED:0:10}..."
          echo "Contains colon: $(echo "$DECODED" | grep -c ':')"

          # URL에 직접 인증 정보 삽입
          AUTH_URL="${MATCH_GIT_URL/https:\/\//https://${DECODED}@}"
          GIT_TERMINAL_PROMPT=0 git clone "$AUTH_URL" /tmp/test-clone --depth 1
          echo "✅ Clone succeeded!"
